project:
  name: evidence
  output_root: outputs/evidence
  artifact_root: artifacts/evidence
  seeds: [17, 29, 43]

data:
  hand: left
  cropped_root: artifacts/havid_clips/lh_v0
  full_root: artifacts/havid_clips/lh_v0_original
  right_root: artifacts/havid_clips/rh_v0
  ground_truth: artifacts/havid/ground_truth.jsonl
  mapping: artifacts/havid_clips/mapping_semantics.txt
  composition_split: artifacts/splits/composition_split_v1.json
  primitive_split: artifacts/splits/primitive_split_v1.json
  train_dir: videos_train
  test_dir: videos_val
  corrupt_clip_ids: [S10A05I01M0_rgw_0]

evidence:
  source: video          # cropped workspace view (lh_v0) — the proven input; 'full_video' = full scene
  scan_frames: 48
  num_keyframes: 10
  keyframe_method: energy   # motion-mass quantiles + transition snap; 'stratified'/'uniform' for ablations
  keyframe_size: 448
  som_size: 640
  max_marks: 8
  min_mark_area_frac: 0.0008
  max_mark_area_frac: 0.20   # reject person/background-sized segments
  include_som: true
  fastsam_path: models/FastSAM-s.pt
  som_device: cpu
  min_detection_confidence: 0.35
  hand_landmarker_model: models/hand_landmarker.task  # mediapipe>=0.10.30 tasks API
  pose_landmarker_model: models/pose_landmarker_lite.task  # person suppression for SoM ranking
  mediapipe_input_mirrored: false
  min_track_coverage: 0.40
  include_degraded_video: true
  degrade_side: 96
  degrade_frame_stride: 4

vlm:
  model: Qwen3/Qwen3-VL-8B-Instruct
  local_dir: Qwen3/Qwen3-VL-8B-Instruct
  video_source: video    # cropped workspace view for the main video input (matches v10 protocol)
  dtype: bfloat16
  lora_rank: 16
  lora_alpha: 32
  lora_dropout: 0.05
  max_images: 11
  video_max_pixels: 262144
  video_max_frames: 32
  max_new_tokens: 128

sft:
  epochs: 2
  learning_rate: 8.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.05
  grad_accum: 8
  max_grad_norm: 1.0
  log_every: 10
  save_every: 500
  necessity_fraction: 0.35
  degrade_fraction: 0.15

grpo:
  epochs: 1
  learning_rate: 1.0e-5
  weight_decay: 0.0
  group_size: 6
  grad_accum_groups: 2
  temperature: 1.0
  top_p: 0.95
  kl_beta: 0.05
  max_grad_norm: 1.0
  log_every: 10
  save_every: 100
  reward:
    w_format: 0.5
    w_slot: 2.0
    w_valid: 0.5
    w_composite: 2.0
    macro_weighted: true
    validity_reward: true
    macro_alpha: 0.5
    max_class_weight: 10.0

evaluation:
  decoding: soft_grammar
  primary_metric: active_composite_accuracy
  bootstrap_samples: 10000
  permutation_samples: 10000
  confidence: 0.95
  holm_alpha: 0.05
