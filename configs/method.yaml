# Pooled dual-hand recipe: long-tail augmentation x hand anchoring.
# Adapters: spatial (run_spatial) vs hand (run_hand_anchored). The adapter class
# is swapped by the runner, not by config, so d_L0_v2 vs d_L0_v3 isolates hand
# anchoring. Parents are per-split.

x-dual: &dual
  stage: sft
  evidence: true
  use_badges: true
  necessity: true
  degrade: true
  reliability_mix: true
  arbitration: true
  freeze_vlm: false

x-child: &child
  <<: *dual
  rapt: true
  slot_aux: true
  utility_gate: true
  bank_mode: evidence
  injection_layer: 0
  injection_site: decoder_early
  init_variant: rivet_r_sft_no_som_ep2

experiments:
  # Parent alias (epoch_2 snapshot).
  - name: rivet_r_sft_no_som_ep2
    <<: *dual
    rapt: false
    baseline: video_only

  # Parent alias (epoch_4).
  - name: rivet_r_sft_no_som_ep4
    <<: *dual
    rapt: false
    baseline: video_only

  # ---- parent LoRA (no adapter). Train one per data split. ----
  - name: rivet_r_sft_no_som
    <<: *dual
    rapt: false
    baseline: video_only

  # ---- Stage-2 cells ----
  - name: d_L0_v2
    <<: *child
    baseline: rivet_r_sft_no_som

  - name: d_L0_v3
    <<: *child
    baseline: d_L0_v2

  - name: d_L0_v2_ep4
    <<: *child
    init_variant: rivet_r_sft_no_som_ep4
    baseline: rivet_r_sft_no_som

  - name: d_L0_v3_ep4
    <<: *child
    init_variant: rivet_r_sft_no_som_ep4
    baseline: d_L0_v2_ep4

  # Parent alias (epoch_6).
  - name: rivet_r_sft_no_som_ep6
    <<: *dual
    rapt: false
    baseline: video_only

  - name: d_L0_v2_ep6
    <<: *child
    init_variant: rivet_r_sft_no_som_ep6
    baseline: rivet_r_sft_no_som

  # Parent alias (epoch_5).
  - name: rivet_r_sft_no_som_ep5
    <<: *dual
    rapt: false
    baseline: video_only

  - name: d_L0_v2_ep5
    <<: *child
    init_variant: rivet_r_sft_no_som_ep5
    baseline: rivet_r_sft_no_som

  # Assembly101 (single-stream, hand-agnostic).
  - name: a101_parent
    <<: *dual
    rapt: false
    baseline: video_only

  # run_informative drops the single degenerate slot (status on Assembly101,
  # tool on IKEA ASM) from the auxiliary loss; it equals run_spatial on HA-ViD.
  - name: a101_L0_v2
    <<: *child
    init_variant: a101_parent_ep_final
    baseline: a101_parent
    runner: run_informative

  # ---- IKEA ASM (single-stream, hand-agnostic) ----
  - name: ikea_parent
    <<: *dual
    rapt: false
    baseline: video_only

  - name: ikea_L0_v2
    <<: *child
    init_variant: ikea_parent_ep4
    baseline: ikea_parent
    runner: run_informative

  # Assembly101 with the head cap raised to 200 (see configs/assembly101.yaml).
  - name: a101_cap200_parent
    <<: *dual
    rapt: false
    baseline: video_only

  - name: a101_cap200_L0_v2
    <<: *child
    init_variant: a101_cap200_parent_ep_final
    baseline: a101_cap200_parent
    runner: run_informative

  # Cropped Assembly101 (see configs/assembly101_cropped.yaml).
  - name: a101c_parent
    <<: *dual
    rapt: false
    baseline: video_only

  - name: a101c_L0_v2
    <<: *child
    init_variant: a101c_parent_ep_final
    baseline: a101c_parent
    runner: run_informative
