# evidence for the VIEW-2 right-hand split (rh_v2), cropped with the
# shared view-2 box (300,0,1275,620) by data.havid --view v2.
#
# View 2 is a third camera on the same HA-ViD recordings -- an overhead view of
# the bench, session ids ending in S2 -- so the label space and splits match
# views 0 and 1 exactly.
#
#   python -m data.evidence --config configs/evidence_havid_overhead_right.yaml \
#       build --resume --splits train,test
extends: evidence.yaml

project:
  name: evidence_havid_overhead_right
  artifact_root: artifacts/havid_overhead_right
  output_root: outputs/evidence_rh_v2

data:
  hand: right
  cropped_root: artifacts/havid_clips/rh_v2_cropped

evidence:
  source: video
  output_dirname: evidence
